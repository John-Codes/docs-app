name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: local-test-key
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CHAT_PROVIDER: nvidia
      CHAT_MODEL: openai/gpt-oss-20b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app
      - name: Check required secrets
        working-directory: backend
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Missing OPENROUTER_API_KEY or NVIDIA_API_KEY secret — e2e tests require at least one LLM provider"
            exit 1
          fi
      - name: End-to-end tests against local Qdrant and real APIs
        working-directory: backend
        run: pytest tests -q

  deploy:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_API_KEY != ''
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('deploy', d.get('id'), d.get('status'))"
