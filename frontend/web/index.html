<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="docs_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>docs_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- On-device AI (local mode): storage helpers + MediaPipe's web engine.
       If the CDN is unreachable the app still works; it silently stays on
       the cloud chat. See lib/features/local_ai/. -->
  <script src="cache_api.js"></script>
  <script src="opfs_helper.js"></script>
  <!-- On-device search model (Gecko) via LiteRT.js. The entry module imports
       the three sibling files by relative path, so all four live here. The
       ~9 MB WASM runtime is served from web/wasm/ (set in
       on_device_rag_startup.dart), never from a CDN. -->
  <script type="module" src="litert_embeddings.js"></script>
  <script type="module">
    import { FilesetResolver, LlmInference } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29';
    window.FilesetResolver = FilesetResolver;
    window.LlmInference = LlmInference;
  </script>
  <!-- Pre-Flutter error bridge: catches JS failures (OPFS, workers, WASM)
       before the app is up and posts them to /errors. Keeps only the first
       line of the message; no tokens, no page content. -->
  <script>
    (function () {
      function post(kind, message) {
        try {
          fetch('/errors', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'js_' + kind,
              stage: 'bootstrap',
              error: { name: kind, message: String(message).split('\n')[0] },
              device: { ua: navigator.userAgent, platform: navigator.platform },
              caps: {},
              app: { preFlutter: true },
            }),
          }).catch(function () {});
        } catch (e) { /* never break the page */ }
      }
      window.onerror = function (message) { post('error', message); };
      window.addEventListener('unhandledrejection', function (event) {
        post('rejection', event.reason && (event.reason.message || event.reason));
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
